<!-- Need this to display longer after click : (submit)="$event.preventDefault()" -->

<form (submit)="$event.preventDefault()">
    <input 
        type="text"
        class="form-control"
        (keydown.enter)="addTopic(topic)" 
        #topic
    >
    <ul class="list-group">
        <li 
            *ngFor="let topic of topics.controls; let i = index" 
            (click)="removeTopic(i)"
            class="list-group-item">
            {{ topic.value }}
        </li>
    </ul>

</form>
