<h2>Posts</h2>
<input 
    type="text"
    (keydown.enter)="createPost(title)"
    #title>
<ul>
    <li
    *ngFor="let post of posts">
    <button (click)="updatePost(post)">
        Update
    </button>
    {{ post.title }}
    <button (click)="deletePost(post)">
        Delete
    </button>
    </li>
</ul>
